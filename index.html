<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team SP — Subodh Premi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">SP<span>°</span></div>

        <div class="brand">SUBODH PREMI</div>
    </header>


    <main>

        <section class="team-section">

            <p class="eyebrow">TEAM SP · 05 PEOPLE</p>

            <h1>Our Team</h1>

            <div class="team-carousel">

                <!-- Previous Button -->
                <button class="arrow prev" id="prevBtn">
                    ←
                </button>


                <!-- Cards -->
                <div class="cards-container" id="cardsContainer">

                    <!-- Aarav -->
                    <article class="team-card">
                        <img src="Aarav Sharma.png" alt="Aarav Sharma">

                        <div class="card-info">
                            <h2>Aarav Sharma</h2>
                            <p>Script Writer</p>
                        </div>
                    </article>


                    <!-- Naysha -->
                    <article class="team-card">
                        <img src="Naysha Singh.png" alt="Naysha Singh">

                        <div class="card-info">
                            <h2>Naysha Singh</h2>
                            <p>Graphics Designer</p>
                        </div>
                    </article>


                    <!-- Aditya -->
                    <article class="team-card active">
                        <img src="Aditya Maurya.png" alt="Aditya Maurya">

                        <div class="card-info">
                            <h2>Aditya Maurya</h2>
                            <p>Web &amp; App Developer</p>
                        </div>
                    </article>


                    <!-- Aria -->
                    <article class="team-card">
                        <img src="Aria Solene.png" alt="Aria Solene">

                        <div class="card-info">
                            <h2>Aria Solene</h2>
                            <p>Social Media Manager</p>
                        </div>
                    </article>


                    <!-- Rohan -->
                    <article class="team-card">
                        <img src="Rohan Mehta.png" alt="Rohan Mehta">

                        <div class="card-info">
                            <h2>Rohan Mehta</h2>
                            <p>Video Editor</p>
                        </div>
                    </article>

                </div>


                <!-- Next Button -->
                <button class="arrow next" id="nextBtn">
                    →
                </button>

            </div>


            <!-- Counter -->
            <div class="counter">
                <span id="currentNumber">03</span>
                <span>/</span>
                <span>05</span>
            </div>


            <p class="instruction">
                DRAG · SWIPE · ARROWS
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
